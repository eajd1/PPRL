# Hospital transport: CA-verified TLS 1.3 client certificates.
server {
    listen 8443 ssl;
    server_name _;
    ssl_protocols TLSv1.3;
    ssl_certificate /run/tls/broker.crt;
    ssl_certificate_key /run/tls/broker.key;
    ssl_client_certificate /run/tls/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_session_tickets off;
    client_max_body_size 26m;
    server_tokens off;
    access_log off;
    location /api/v1/submissions {
        include /etc/nginx/proxy-hospital.conf;
    }
    location = /api/health {
        include /etc/nginx/proxy-hospital.conf;
    }
    location / { return 404; }
}

# Original React dashboard and existing administrator-token login over HTTPS.
server {
    listen 9443 ssl;
    server_name _;
    ssl_protocols TLSv1.3;
    ssl_certificate /run/tls/broker.crt;
    ssl_certificate_key /run/tls/broker.key;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    location /api/v1/submissions { return 404; }
    location / {
        include /etc/nginx/proxy-operator.conf;
    }
}
