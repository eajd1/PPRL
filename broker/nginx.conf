# Hospital endpoint: no HTTP listener and no protocols older than TLS 1.3.
server {
    listen 8443 ssl;
    server_name _;
    ssl_protocols TLSv1.3;
    ssl_certificate /run/tls/broker.crt;
    ssl_certificate_key /run/tls/broker.key;
    ssl_client_certificate /run/tls/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_session_tickets off;
    client_max_body_size 4k;
    server_tokens off;
    access_log off;
    add_header Cache-Control no-store always;
    location = /api/submissions {
        limit_except POST { deny all; }
        include /etc/nginx/proxy-hospital.conf;
    }
    location = /api/health {
        limit_except GET { deny all; }
        include /etc/nginx/proxy-hospital.conf;
    }
    location / { return 404; }
}

# Operator endpoint: HTTPS + password login, never accepts hospital submissions.
server {
    listen 9443 ssl;
    server_name _;
    ssl_protocols TLSv1.3;
    ssl_certificate /run/tls/broker.crt;
    ssl_certificate_key /run/tls/broker.key;
    ssl_session_tickets off;
    auth_basic "PPRL broker operator";
    auth_basic_user_file /run/tls/operator.htpasswd;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
    location = /api/submissions {
        limit_except GET { deny all; }
        include /etc/nginx/proxy-operator.conf;
    }
    location = /api/health {
        limit_except GET { deny all; }
        include /etc/nginx/proxy-operator.conf;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
