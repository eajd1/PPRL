# Each hospital gets only its own bundle and service credential.
services:
  backend:
    environment:
      HOSPITAL_ID: ${HOSPITAL_ID:?Set numeric hospital ID}
      PPRL_BROKER_URL: ${PPRL_BROKER_URL:?Set broker HTTPS origin}
    volumes: !override
      - ./backend/runtime:/app/runtime
      - ${HOSPITAL_TLS_DIR:?Set hospital certificate bundle}:/run/hospital-tls/hospital${HOSPITAL_ID:?Set numeric hospital ID}:ro
  postgres:
    profiles: [broker]
  broker:
    profiles: [broker]
  broker-proxy:
    profiles: [broker]
