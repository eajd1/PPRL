services:
  broker-api:
    build:
      context: .
      dockerfile: broker/Dockerfile
    environment:
      BROKER_DATA_DIR: /data/received
      BROKER_ALLOWLIST: /run/config/allowlist.json
    volumes:
      - ./broker/data:/data
      - broker-socket:/run/pprl
      - ${BROKER_TLS_DIR:-./certs/broker}/allowlist.json:/run/config/allowlist.json:ro
    network_mode: none
    restart: unless-stopped
  broker-proxy:
    image: nginx:1.28-alpine
    ports:
      - "${BROKER_BIND_IP:-0.0.0.0}:${BROKER_PORT:-8443}:8443"
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:${DASHBOARD_PORT:-9443}:9443"
    volumes:
      - ./broker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./broker/proxy-hospital.conf:/etc/nginx/proxy-hospital.conf:ro
      - ./broker/proxy-operator.conf:/etc/nginx/proxy-operator.conf:ro
      - ./broker/frontend:/usr/share/nginx/html:ro
      - ${BROKER_TLS_DIR:-./certs/broker}:/run/tls:ro
      - broker-socket:/run/pprl:ro
    depends_on:
      - broker-api
    restart: unless-stopped
volumes:
  broker-socket:
