services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      PPRL_RUNTIME_DIR: /app/runtime
      PPRL_BROKER_URL: https://broker-proxy:8443
      PPRL_TLS_DIR: /run/hospital-tls
    volumes:
      - ./backend/runtime:/app/runtime
      - ${PPRL_CERT_DIR:-./certs/unified}/hospital1:/run/hospital-tls/hospital1:ro
      - ${PPRL_CERT_DIR:-./certs/unified}/hospital2:/run/hospital-tls/hospital2:ro
      - ${PPRL_CERT_DIR:-./certs/unified}/hospital3:/run/hospital-tls/hospital3:ro
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${HOSPITAL_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    networks: [broker-private]
    image: postgres:17-alpine
    env_file:
      - .env.postgres
    volumes:
      - pprl-broker-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  broker:
    networks: [broker-private]
    build:
      context: .
      dockerfile: backend/Broker.Dockerfile
    env_file:
      - .env.broker
    environment:
      BROKER_CERTIFICATE_ALLOWLIST: /run/tls/allowlist.json
    volumes:
      - ${PPRL_CERT_DIR:-./certs/unified}/broker/allowlist.json:/run/tls/allowlist.json:ro
      - broker-socket:/run/pprl
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(3); s.connect('/run/pprl/broker.sock'); s.sendall(b'GET /api/health HTTP/1.0'+bytes([13,10])+b'Host: localhost'+bytes([13,10,13,10])); assert b' 200 ' in s.recv(1024)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  broker-proxy:
    image: nginx:1.28-alpine
    ports:
      - "${BROKER_BIND_IP:-127.0.0.1}:${BROKER_PORT:-8443}:8443"
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:${DASHBOARD_PORT:-9443}:9443"
    volumes:
      - ./broker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./broker/proxy-hospital.conf:/etc/nginx/proxy-hospital.conf:ro
      - ./broker/proxy-operator.conf:/etc/nginx/proxy-operator.conf:ro
      - ${PPRL_CERT_DIR:-./certs/unified}/broker:/run/tls:ro
      - broker-socket:/run/pprl:ro
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pprl-broker-db:
  broker-socket:
networks:
  broker-private:
    internal: true
